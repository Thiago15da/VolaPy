<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VOLA — Aviación privada y helicópteros en Paraguay. Vuelos charter domésticos, experiencias VIP y empty legs bajo demanda." />
    <title>VOLA | Aviación Privada & Helicópteros en Paraguay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Jost:wght@200;300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Navy de marca: tiñe la barra del navegador en móviles -->
    <meta name="theme-color" content="#050F1B" />
    <!--
      Fallback de rutas para GitHub Pages.
      public/404.html codifica la ruta original en la query y redirige aquí;
      este script la restaura antes de que React Router monte, para que los
      enlaces directos (vola.com.py/taxi-aereo) no terminen en un 404.
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
