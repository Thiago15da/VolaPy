name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Interruptor de la cortina de "sitio en construcción".
      #
      # Fuente principal: el archivo maintenance/enabled (true / false).
      # Se edita desde la web de GitHub y el push dispara el deploy solo.
      #
      # La variable de repositorio MAINTENANCE_MODE (Settings → Secrets and
      # variables → Actions → Variables) también puede forzarla, por si se
      # prefiere ese camino.
      - name: Leer el interruptor
        id: flag
        env:
          VAR_MODE: ${{ vars.MAINTENANCE_MODE }}
        run: |
          set -euo pipefail
          MODE="$(tr -d '[:space:]' < maintenance/enabled 2>/dev/null || echo false)"
          if [ "${VAR_MODE:-}" = "true" ]; then MODE=true; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "true" ]; then
            echo "::notice::Cortina ACTIVA — se publica sólo la página de aviso."
          else
            echo "::notice::Cortina apagada — se publica el sitio completo."
          fi

      # --- Modo mantenimiento ---------------------------------------------
      # La aplicación no se compila ni se sube: el bundle nunca llega al
      # servidor, así que no hay contenido que inspeccionar desde el navegador.
      - name: Publicar sólo la cortina
        if: steps.flag.outputs.mode == 'true'
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp maintenance/index.html dist/index.html
          # Misma página como 404 para que cualquier ruta (/taxi-aereo, /comunidad…)
          # muestre el aviso en vez del 404 de GitHub. Sin el script de fallback
          # SPA: acá la página tiene que mostrarse, no redirigir.
          cp maintenance/index.html dist/404.html
          # Sin CNAME el dominio propio se cae y Pages vuelve a servir en /VolaPy/
          cp public/CNAME dist/CNAME
          echo "Contenido de dist/:"
          ls -la dist
          if [ -d dist/assets ] || ls dist/*.js >/dev/null 2>&1; then
            echo "::error::Se coló un bundle en dist/: la cortina no estaría bloqueando nada."
            exit 1
          fi

      # --- Modo normal -----------------------------------------------------
      - name: Setup Node
        if: steps.flag.outputs.mode != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.flag.outputs.mode != 'true'
        run: npm ci

      - name: Build
        if: steps.flag.outputs.mode != 'true'
        run: npm run build

      # --- Publicación (común a ambos caminos) -----------------------------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
